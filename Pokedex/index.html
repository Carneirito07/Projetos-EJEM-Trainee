<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Pokédex</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="cabecalho">
            <h1>Buscador de Pokémon</h1>
            <p>PokéAPI based Pokédex by Carneirito</p>
        </header>

        <main>
            <div class="principal">
                <div class="barra">
                    <div class="pesquisa">
                        <input type="search" id="barra-pesquisa" placeholder="Digite o nome ou número do pokémon..." autocomplete="off">
                        <ul id="sugestoes"></ul>
                    </div>
                    <button id="botao-busca" border-radius: 12px padding: 0 20px cursor: pointer>Buscar</button>
                </div>
                

                <div class="pokemon">
                    <img id="imagem-pokemon" alt="">
                    <h2 id="nome-pokemon">Busque um Pokémon</h2>
                    <div id="tipo-pokemon"></div>
                    <div class="medidas">
                        <p id="altura-pokemon"></p>
                        <p id="peso-pokemon"></p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="rodape">
            <p>Desenvolvido por Carneirito</p>
            <p>Contato: joao.carneiro@ejemmackenzie.com.br ou jmcontatopc@gmail.com</p>
            <p>Dados fornecidos pela <a href="https://pokeapi.co" target="_blank">PokéAPI</a></p>
            <p>;¬)</p>
        </footer>
        
        <script src="script.js"></script>
    </body>
</html>
