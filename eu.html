<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <title>Portifólio</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100%;
                min-height: 100%;
            }

            body {
                background-image: url("midia/fundo.png");
                background-repeat: no-repeat;
                background-position: center;
                background-size: cover;
                background-attachment: fixed;
            }

            footer {
                position: relative;
                min-height: 70px;
                background-color: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 10px 120px;
                font-size: 12px;
            }

            main {
                flex: 1;
            }

            .principal {
                width: 700px;
                margin: auto;
                border: 2px solid black;
                background-color: rgba(255, 255, 255, 0.7);
                padding: 30px;
            }

            .topo {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .titulo {
            width: 50%;
            }

            .foto {
                width: 250px;
            }

            .video {
                text-align: center;
                margin-top: 30px;
            }

            .textos {
                display: flex;
                justify-content: center;
                gap: 30px;
                margin-top: 20px;
                margin-bottom: 20px;
            }

            .texto {
                width: 335px;
                min-height: 100px;
                border: 2px solid black;
                background-color: rgba(255, 255, 255, 0.7);
                padding: 10px;
            }

        </style>
    </head>

    <body>
        <div class="principal">
            <div class="topo">
                <div class="titulo">
                    <h1>This is <span style="color: green; font-weight: 900;"">  João Manoel </span></h1>
                    <p>Texto do cacete.</p>
                </div>

                <img src="midia/eum.jpg" alt="foto muito foda: eu tocando bateira em P&B." height="50%" width="50%">

            </div>

            <div class="video">
                <video width="640" height="360" controls>
                    <source src="midia/V_1.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        
        <div class="textos">
            <div class="texto">
                <center><h2>Top 10 coisas</h2></center>
                <p>texto das top 10 coisas</p>
            </div>

            <div class="texto">
                <center><h2>Top 10 animais</h2></center>
                <p>texto dos top 10 animais</p>
            </div>
        </div>

        <footer>
            <center><h2>Não tem link caralho</h2></center>
        </footer>
    </body>   
</html>
