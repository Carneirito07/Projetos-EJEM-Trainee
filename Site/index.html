<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <title>Portifólio</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100%;
                min-height: 100%;
            }

            body {
                background-image: url("midia/fundo.png");
                background-repeat: no-repeat;
                background-position: center;
                background-size: cover;
                background-attachment: fixed;
            }

            footer {
                position: relative;
                min-height: 70px;
                background-color: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 10px 120px;
                font-size: 12px;
            }

            main {
                flex: 1;
            }

            .principal {
                width: 700px;
                margin: auto;
                border: 2px solid black;
                background-color: rgba(255, 255, 255, 0.7);
                padding: 30px;
                margin-bottom: 10px;
            }

            .topo {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .titulo {
            width: 50%;
            }

            .foto {
                width: 250px;
            }

            .video {
                text-align: center;
                margin-top: 30px;
            }
        </style>
    </head>

    <body>
        <div class="principal">
            <div class="topo">
                <div class="titulo">
                    <h1>This is <span style="color: green; font-weight: 900;"> João Manoel </span></h1>
                    <p>Vê o vídeo.</p>
                </div>

                <img src="midia/eum.jpg" alt="foto muito foda: eu tocando bateria em P&B." height="50%" width="50%">

            </div>

            <div class="video">
                <iframe width="560" height="315" 
                src="https://www.youtube.com/embed/13Av75fVH60?si=geG2fipq79st9_l4" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
            </div>
        </div>
    </body>   

    <footer>
        <center><h2>Não tem link caralho</h2></center>
    </footer>
</html>
